title: Tristan Lazard
first_name: Tristan
middle_name:
last_name: Lazard
email: trislaz.tl@gmail.com
description: Personal website of Tristan Lazard, a researcher working on interpretable AI for scientific discovery in biology.
lang: en
icon: 🔬

url: https://trislaz.github.io
baseurl:

profile_image: prof_pic.jpg
cv_path: /assets/pdf/cv_anglais.pdf

github_username: trislaz
linkedin_username: tristan.lazard
scholar_userid: OAKoksYAAAAJ
orcid_id: 0000-0002-3553-768X

serve_og_meta: true
og_image: /assets/img/prof_pic.jpg

collections:
  news:
    output: false

announcements:
  limit: 6

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

include:
  - _pages

exclude:
  - bin
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - CONTRIBUTING.md
  - CUSTOMIZE.md
  - FAQ.md
  - INSTALL.md
  - Dockerfile
  - docker-compose.yml
  - package.json
  - package-lock.json

plugins:
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll/scholar
  - jekyll-sitemap
  - jemoji

defaults:
  - scope:
      path: assets
    values:
      sitemap: false

sass:
  style: compressed

jekyll-minifier:
  exclude:
    - robots.txt

scholar:
  last_name:
    - Lazard
  first_name:
    - Tristan
    - T.
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters:
    - latex
    - smallcaps
    - superscript
  replace_strings: true
  join_strings: true
  query: "@*"
  group_by: year
  group_order: descending

enable_publication_thumbnails: true
filtered_bibtex_keywords:
  - abbr
  - abstract
  - altmetric
  - arxiv
  - bibtex_show
  - blog
  - code
  - dimensions
  - html
  - pdf
  - poster
  - preview
  - selected
  - slides
  - supp
  - video
  - website

external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
