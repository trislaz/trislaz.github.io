name: Site links

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Build
        run: bundle exec jekyll build
      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: --offline --verbose --no-progress --root-dir "_site" "_site/**/*.html"
